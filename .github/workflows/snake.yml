name: Contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff2d55&color_dots=#ebedf0,#ffc2cf,#ff7a93,#ff2d55,#b3002a
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff2d55&color_dots=#161b22,#4a0f1c,#8a1530,#d4204a,#ff2d55
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
